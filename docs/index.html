<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>The Ethiopian Canon — A Close Rendering</title>
<style>
  :root{
    --bg:#fbfaf7; --ink:#20211f; --muted:#6c6a63; --rule:#e2ded4;
    --accent:#7a5c2e; --panel:#f4f1ea;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16171a; --ink:#e8e5dd; --muted:#9a968c; --rule:#2e3035;
           --accent:#c8a86a; --panel:#1d1f23; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.65 Georgia,'Iowan Old Style',serif}
  #wrap{display:flex;min-height:100vh}
  nav{width:270px;flex:none;border-right:1px solid var(--rule);
      background:var(--panel);overflow-y:auto;height:100vh;position:sticky;top:0}
  nav h1{font-size:14px;letter-spacing:.09em;text-transform:uppercase;
         color:var(--muted);margin:0;padding:20px 18px 12px;font-weight:600}
  nav a{display:block;padding:6px 18px;color:var(--ink);text-decoration:none;
        font-size:14.5px;border-left:3px solid transparent}
  nav a:hover{background:rgba(122,92,46,.09)}
  nav a.on{border-left-color:var(--accent);color:var(--accent);font-weight:700}
  nav a .ct{float:right;color:var(--muted);font-size:12px;font-weight:400}
  nav a.pending{color:var(--muted)}
  main{flex:1;min-width:0;padding:44px 6vw 140px;max-width:820px}
  /* a supplement is a chart, not a reading column - let it have the room */
  main.wide{max-width:1500px;padding-left:3vw;padding-right:3vw}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 30px}
  .chips a{display:block;min-width:40px;text-align:center;padding:7px 10px;
           border:1px solid var(--rule);border-radius:4px;text-decoration:none;
           color:var(--ink);font-size:14px}
  .chips a:hover{border-color:var(--accent);color:var(--accent)}
  .chips a.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  h1{font-size:30px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  h2{font-size:17px;font-weight:600;color:var(--accent);margin:34px 0 14px;
     letter-spacing:.01em}
  h2.notes-head{border-top:1px solid var(--rule);padding-top:26px;margin-top:48px}
  p.v{margin:0 0 13px;text-indent:0}
  a.vn{color:var(--muted);font:600 11px/1 ui-sans-serif,system-ui,sans-serif;
       vertical-align:super;margin-right:6px;text-decoration:none}
  a.vn:hover{color:var(--accent)}
  ul.notes{font-size:14.5px;color:var(--muted);padding-left:20px}
  ul.notes li{margin:0 0 16px}
  ul.notes li p{margin:0 0 9px}
  ul.notes li p:last-child{margin-bottom:0}
  ul.notes strong{color:var(--ink)}
  .lede{color:var(--muted);margin:0 0 34px;font-size:15px}
  .pager{display:flex;gap:10px;align-items:stretch;margin:48px 0 0;
         border-top:1px solid var(--rule);padding-top:22px}
  .pager a{flex:1;display:flex;flex-direction:column;justify-content:center;
           gap:3px;padding:14px 16px;border:1px solid var(--rule);
           border-radius:6px;text-decoration:none;color:var(--ink);
           font:14px/1.3 ui-sans-serif,system-ui,sans-serif}
  .pager a:hover{border-color:var(--accent)}
  .pager a.up{flex:0 0 auto;justify-content:center;text-align:center;
              color:var(--muted)}
  .pager a.nx{text-align:right}
  .pager small{color:var(--muted);font-size:12px;letter-spacing:.06em;
               text-transform:uppercase}
  .pager b{font-weight:600;font-size:16px}
  .stub{border:1px dashed var(--rule);padding:22px;color:var(--muted);
        border-radius:5px}
  p.v.speaking{background:rgba(122,92,46,.14);border-radius:3px;
               box-shadow:0 0 0 4px rgba(122,92,46,.14)}
  #player{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;
          gap:12px;align-items:center;padding:10px 14px;
          background:var(--panel);border-top:1px solid var(--rule);
          font:14px/1 ui-sans-serif,system-ui,sans-serif}
  #player.on{display:flex}
  #player button{font:inherit;cursor:pointer;border:1px solid var(--rule);
                 background:var(--bg);color:var(--ink);border-radius:6px;
                 padding:11px 16px;min-width:88px}
  #player button.primary{background:var(--accent);border-color:var(--accent);
                         color:var(--bg);font-weight:700}
  #player label{color:var(--muted);display:flex;align-items:center;gap:6px}
  #player select{font:inherit;padding:8px;border-radius:6px;
                 border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
  #pvoice{max-width:44vw;text-overflow:ellipsis}
  #pvoicewrap[hidden]{display:none}
  .chips a.last{outline:2px solid var(--accent);outline-offset:1px}
  .chips a.sup{min-width:0;font-style:italic}
  .supp{margin:0 0 30px}
  .supp img{max-width:100%}
  a.resume{display:inline-block;padding:11px 16px;border-radius:8px;
    background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
  p.v{cursor:pointer}
  #ptxt{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;
        white-space:nowrap}
  @media(max-width:760px){
    #player{flex-wrap:wrap;gap:8px;padding:8px 10px}
    #player button{flex:1 1 auto;min-width:0;padding:13px 10px}
    #player label{font-size:13px}
    #ptxt{display:none}
    nav{max-height:30vh}
    #wrap{display:block}
    nav{width:auto;height:auto;position:static;border-right:0;
        border-bottom:1px solid var(--rule);max-height:42vh}
    main{padding:28px 20px 190px}
  }
</style>
<div id="wrap"><nav id="rail"></nav><main id="view"></main></div>
<div id="player">
  <button id="pprev" title="Previous verse">&#9664;&#9664;</button>
  <button id="pplay" class="primary">Read aloud</button>
  <button id="pfwd" title="Next verse">&#9654;&#9654;</button>
  <button id="pstop">Stop</button>
  <label id="pvoicewrap">Voice
    <select id="pvoice"></select>
  </label>
  <label>Speed
    <select id="prate">
      <option value="0.8">0.8</option><option value="0.9">0.9</option>
      <option value="1" selected>1.0</option><option value="1.1">1.1</option>
      <option value="1.25">1.25</option><option value="1.5">1.5</option>
    </select>
  </label>
  <label><input type="checkbox" id="pnext" checked> Keep going</label>
  <span id="ptxt"></span>
</div>
<script>
let BOOKS=[], cache={};
const rail=document.getElementById('rail'), view=document.getElementById('view');

function drawRail(slug){
  rail.innerHTML='<h1>The Ethiopian Canon</h1>'+BOOKS.map(b=>
    `<a href="#/${b.slug}" class="${b.slug===slug?'on':''}${b.done?'':' pending'}">`+
    `${b.order}. ${b.title}<span class="ct">${b.done||'—'}</span></a>`).join('');
}
async function load(slug){
  if(!cache[slug]) cache[slug]=await (await fetch(`data/${slug}.json?v=9de13e6857d0`)).json();
  return cache[slug];
}
function pager(d,cur){
  const list=d.chapters, i=list.findIndex(c=>c.n==cur);
  if(i<0) return '';
  const prev=list[i-1], next=list[i+1], slug=d.book.slug, title=d.book.title;
  const cell=(c,cls,label)=>c
    ? `<a class="${cls}" href="#/${slug}/${c.n}"><small>${label}</small>`+
      `<b>${title} ${c.n}</b></a>`
    : '';
  const sup=next?null:(d.supplements||[])[0];   // past the last chapter: the chart
  return '<div class="pager">'+
    cell(prev,'pv','Previous')+
    `<a class="up" href="#/${slug}"><small>All</small><b>${title}</b></a>`+
    (sup?`<a class="nx" href="#/${slug}/s${sup.n}"><small>Next</small>`+
         `<b>${sup.title}</b></a>`
        :cell(next,'nx','Next'))+
    '</div>';
}

function nextStop(slug,ch){          // where "keep going" goes when a chapter ends
  const d=cache[slug]; if(!d) return null;
  const list=d.chapters, i=list.findIndex(c=>String(c.n)===String(ch));
  if(i<0) return null;
  if(list[i+1]) return `#/${slug}/${list[i+1].n}`;
  const s=(d.supplements||[])[0];
  return s?`#/${slug}/s${s.n}`:null;   // no next chapter and no chart: stop
}

function chips(d,cur){
  if(!d.chapters.length) return '';
  const last=(say('last')||'').split('/');            // #/slug/ch
  const lastSlug=last[1], lastCh=last[2];
  const nums=d.chapters.map(c=>{
    const here = c.n==cur ? ' on' : '';
    const seen = (d.book.slug===lastSlug && String(c.n)===lastCh) ? ' last' : '';
    return `<a href="#/${d.book.slug}/${c.n}" class="${here}${seen}">`+
           `${c.status==='need_source'?'—':c.n}</a>`;
  }).join('');
  const sups=(d.supplements||[]).map(s=>{
    const id='s'+s.n, here = id===String(cur) ? ' on' : '';
    return `<a href="#/${d.book.slug}/${id}" class="sup${here}">${s.title}</a>`;
  }).join('');
  return '<div class="chips">'+nums+sups+'</div>';
}
async function route(){
  const [,slug,ch]=(location.hash||'').replace(/^#/,'').split('/');
  view.classList.toggle('wide',/^s\d+$/.test(ch||''));   // charts get the full width
  drawRail(slug);
  if(!ch){ stop(); bar.classList.remove('on'); }
  if(!slug){
    const done=BOOKS.reduce((a,b)=>a+b.done,0),
          all=BOOKS.reduce((a,b)=>a+b.chapters,0);
    view.innerHTML='<h1>A Close Rendering</h1><p class="lede">'+
      'The Ethiopian Orthodox Tewahedo canon, rendered chapter by chapter with '+
      'attention to what English normally loses. Choose a book at left.</p>'+
      `<p class="lede">${done} of ${all} chapters rendered.</p>`+resumeLink();
    return;
  }
  const d=await load(slug);
  if(!ch){
    view.innerHTML=`<h1>${d.book.title}</h1><p class="lede">`+
      (d.chapters.length?`${d.chapters.length} of ${d.book.chapters} chapters`
                        :'Not yet begun.')+'</p>'+chips(d);
    return;
  }
  if(/^s\d+$/.test(ch)){                              // a supplement, not a chapter
    const s=(d.supplements||[]).find(x=>'s'+x.n===ch);
    view.innerHTML=chips(d,ch)+
      (s?`<div class="supp">${s.html}</div>`:'<p class="stub">Not found.</p>')+
      `<div class="pager">`+
      (d.chapters.length
        ? `<a class="pv" href="#/${slug}/${d.chapters[d.chapters.length-1].n}">`+
          `<small>Previous</small><b>${d.book.title} `+
          `${d.chapters[d.chapters.length-1].n}</b></a>` : '')+
      `<a class="up" href="#/${slug}">`+
      `<small>All</small><b>${d.book.title}</b></a></div>`;
    window.scrollTo(0,0); stop(); P.q=[]; bar.classList.remove('on');
    say('last','/'+slug+'/'+ch);
    return;
  }
  const c=d.chapters.find(x=>x.n==ch);
  view.innerHTML=chips(d,ch)+(c?c.html:'<p class="stub">Not yet rendered.</p>')
             +pager(d,ch);
  window.scrollTo(0,0);
  const wasPlaying=P.on;
  stop(); P.q=(c&&c.speech)||[]; P.i=0;
  bar.classList.toggle('on',P.q.length>0);
  keep('last',location.hash);
  if(innerWidth<=760) view.scrollIntoView({block:'start'});  // skip past the rail
  if(wasPlaying && P.q.length) setTimeout(play,350);   // chapter auto-advance
}

/* ---- read aloud -------------------------------------------------------- */
const P={q:[],i:0,on:false,lock:null,tick:null,voices:[],tok:0};
const el=id=>document.getElementById(id);
const bar=el('player'), bPlay=el('pplay'), bStop=el('pstop'),
      bPrev=el('pprev'), bFwd=el('pfwd'),
      selRate=el('prate'), cbNext=el('pnext'), out=el('ptxt'),
      selVoice=el('pvoice'), voiceWrap=el('pvoicewrap');

function say(t){ try{return localStorage.getItem(t)}catch(e){return null} }
function keep(t,v){ try{localStorage.setItem(t,v)}catch(e){} }

async function wake(want){
  try{
    if(want && 'wakeLock' in navigator && !P.lock)
      P.lock=await navigator.wakeLock.request('screen');
    if(!want && P.lock){ P.lock.release(); P.lock=null; }
  }catch(e){}
}

function stop(){
  P.on=false; P.tok++; speechSynthesis.cancel(); clearInterval(P.tick); P.tick=null;
  document.querySelectorAll('p.v.speaking').forEach(n=>n.classList.remove('speaking'));
  bPlay.textContent='Read aloud'; out.textContent=''; wake(false);
}

function speakAt(n){
  if(!P.on) return;
  if(n>=P.q.length){                       // chapter finished
    const [,slug,ch]=(location.hash||'').replace(/^#/,'').split('/');
    const nx=(cbNext.checked && slug && ch)?nextStop(slug,ch):null;
    if(nx) location.hash=nx;                       // route() restarts playback
    else stop();
    return;
  }
  P.i=n; const chunk=P.q[n];
  document.querySelectorAll('p.v.speaking').forEach(x=>x.classList.remove('speaking'));
  if(chunk.id){
    const node=document.getElementById(chunk.id);
    if(node){ node.classList.add('speaking');
      node.scrollIntoView({block:'center',behavior:'smooth'}); }
  }
  out.textContent=chunk.text.slice(0,90);
  const u=new SpeechSynthesisUtterance(chunk.text);
  const v=P.voices.find(x=>x.name===selVoice.value);
  if(v){ u.voice=v; u.lang=v.lang; }
  u.rate=parseFloat(selRate.value);
  const tok=++P.tok;                       // this utterance's ticket
  u.onend  =()=>{ if(tok===P.tok) speakAt(n+1); };
  u.onerror=()=>{ if(tok===P.tok) speakAt(n+1); };
  speechSynthesis.speak(u);
}

function play(){
  if(!P.q.length) return;
  P.on=true; bPlay.textContent='Pause'; wake(true);
  // some browsers suspend long speech; nudging it keeps it alive
  clearInterval(P.tick);
  P.tick=setInterval(()=>{ if(P.on && speechSynthesis.speaking && !speechSynthesis.paused)
                             { speechSynthesis.pause(); speechSynthesis.resume(); } },9000);
  speakAt(P.i);
}

bPlay.onclick=()=>{ if(P.on){ P.on=false; P.tok++; speechSynthesis.cancel();
                              clearInterval(P.tick); bPlay.textContent='Resume';
                              wake(false); } else play(); };
bStop.onclick=()=>{ P.i=0; stop(); };

// step one verse at a time, and start playing if we were not
function jump(n){
  if(!P.q.length) return;
  n=Math.max(0,Math.min(n,P.q.length-1));
  P.tok++;                                 // void the utterance we are killing
  speechSynthesis.cancel();
  P.i=n;
  if(P.on) speakAt(n); else play();
}
bPrev.onclick=()=>jump(P.i-1);
bFwd .onclick=()=>jump(P.i+1);

// tap any verse to hear it from there
view.addEventListener('click',e=>{
  if(String(getSelection())) return;           // let people select text
  const p=e.target.closest('p.v'); if(!p||!p.id) return;
  const n=P.q.findIndex(c=>c.id===p.id);
  if(n>=0) jump(n);
});
selRate.onchange=()=>{ keep('rate',selRate.value); if(P.on) jump(P.i); };
cbNext.onchange=()=>keep('next',cbNext.checked?'1':'0');
function loadVoices(){
  // English first, then the rest; the list is whatever this phone has installed
  const all=speechSynthesis.getVoices()||[];
  P.voices=all.slice().sort((a,b)=>{
    const ea=/^en/i.test(a.lang)?0:1, eb=/^en/i.test(b.lang)?0:1;
    return ea-eb || a.name.localeCompare(b.name);
  });
  voiceWrap.hidden = P.voices.length<2;      // nothing to choose between
  if(!P.voices.length) return;
  const want=say('voice');
  selVoice.innerHTML=P.voices.map(v=>
    `<option value="${v.name.replace(/"/g,'&quot;')}">${v.name} (${v.lang})</option>`
  ).join('');
  if(want && P.voices.some(v=>v.name===want)) selVoice.value=want;
}
selVoice.onchange=()=>{ keep('voice',selVoice.value); if(P.on) jump(P.i); };
loadVoices();
speechSynthesis.onvoiceschanged=loadVoices;   // most browsers load them late

if(say('rate')) selRate.value=say('rate');
if(say('next')==='0') cbNext.checked=false;

function resumeLink(){
  const h=say('last'); if(!h) return '';
  const [,slug,ch]=h.split('/'); if(!slug||!ch) return '';
  const b=BOOKS.find(x=>x.slug===slug); if(!b) return '';
  return `<p class="lede"><a class="resume" href="${h}">`+
         `Continue reading &middot; ${b.title} ${ch}</a></p>`;
}

// remember how far down the chapter we were
let restoring=false;
addEventListener('scroll',()=>{
  if(restoring) return;
  const h=location.hash; if(h.split('/').length<3) return;
  keep('pos', h+'|'+Math.round(scrollY));
},{passive:true});
function restoreScroll(){
  const v=say('pos'); if(!v) return;
  const [h,y]=v.split('|');
  if(h!==location.hash) return;
  restoring=true;
  scrollTo(0,Number(y)||0);
  setTimeout(()=>{restoring=false;},400);
}

addEventListener('hashchange',route);
(async()=>{
  BOOKS=(await (await fetch('data/manifest.json?v=9de13e6857d0')).json()).books;
  const back=!location.hash && say('last');
  if(back){ location.hash=back; }               // open where we left off
  await route();
  if(back) restoreScroll();
})();
</script>
